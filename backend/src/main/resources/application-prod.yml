# ---------------------------------------------------------------------------
# Hetex Courier — PRODUCTION backend configuration
# Activate with: --spring.profiles.active=prod
#
# You can also override any value using environment variables:
#   HETEX_DELHIVERY_TOKEN=<your-token>   (Spring maps _ to . automatically)
#   HETEX_RAZORPAY_KEY_ID=<your-key-id>
#   HETEX_RAZORPAY_KEY_SECRET=<your-secret>
#   HETEX_JWT_SECRET=<long-random-string>
#
# NEVER commit real secrets to version control.
# ---------------------------------------------------------------------------

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hetex}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false

hetex:
  jwt:
    secret: ${HETEX_JWT_SECRET:REPLACE_WITH_LONG_RANDOM_SECRET}
    expiry-days: 30

  # -----------------------------------------------------------------------
  # Delhivery API
  # Obtain your client token from the Delhivery Partner Portal
  # (https://app.delhivery.com or ucp.delhivery.com)
  # The app checks isConfigured() — it must NOT contain "mock" or "change"
  # -----------------------------------------------------------------------
  delhivery:
    token: ${DELHIVERY_API_KEY:${HETEX_DELHIVERY_TOKEN:REPLACE_WITH_REAL_TOKEN}}
    base-url: ${DELHIVERY_API_BASE_URL:https://track.delhivery.com}
    client-name: ${DELHIVERY_CLIENT_NAME:HETEX}

  # -----------------------------------------------------------------------
  # Razorpay API
  # Obtain from: https://dashboard.razorpay.com → Settings → API Keys
  # The key-id also goes into the frontend .env as NEXT_PUBLIC_RAZORPAY_KEY_ID
  # The key-secret and webhook-secret must stay server-side ONLY.
  # -----------------------------------------------------------------------
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:${HETEX_RAZORPAY_KEY_ID:REPLACE_WITH_KEY_ID}}
    key-secret: ${RAZORPAY_KEY_SECRET:${HETEX_RAZORPAY_KEY_SECRET:REPLACE_WITH_KEY_SECRET}}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:${HETEX_RAZORPAY_WEBHOOK_SECRET:REPLACE_WITH_WEBHOOK_SECRET}}

  # -----------------------------------------------------------------------
  # Shipmozo API (Task 01)
  # Credentials for Shipmozo Integration
  # -----------------------------------------------------------------------
  shipmozo:
    base-url: ${SHIPMOZO_BASE_URL:https://shipping-api.com/app/api/v1}
    public-key: ${SHIPMOZO_PUBLIC_KEY:REPLACE_WITH_PUBLIC_KEY}
    private-key: ${SHIPMOZO_PRIVATE_KEY:REPLACE_WITH_PRIVATE_KEY}
