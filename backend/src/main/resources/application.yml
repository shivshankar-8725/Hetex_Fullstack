spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/hetex
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

grpc:
  server:
    port: 9090

hetex:
  jwt:
    secret: hetex-dev-secret-change-in-production
    expiry-days: 30

  # -----------------------------------------------------------------------
  # Delhivery API configuration (Requirement 12)
  # -----------------------------------------------------------------------
  delhivery:
    token: ${DELHIVERY_API_KEY:${HETEX_DELHIVERY_TOKEN:mock-delhivery-token-change-me}}
    base-url: ${DELHIVERY_API_BASE_URL:https://track.delhivery.com}
    client-name: ${DELHIVERY_CLIENT_NAME:HETEX}

  # -----------------------------------------------------------------------
  # Razorpay API configuration (Requirement 12)
  # -----------------------------------------------------------------------
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:${HETEX_RAZORPAY_KEY_ID:rzp_test_mock_key_change_me}}
    key-secret: ${RAZORPAY_KEY_SECRET:${HETEX_RAZORPAY_KEY_SECRET:mock_secret_key_change_me}}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:${HETEX_RAZORPAY_WEBHOOK_SECRET:mock_webhook_secret_change_me}}
