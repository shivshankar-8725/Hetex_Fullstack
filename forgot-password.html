<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Reset Password | HetEx Logistics</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/_next/static/chunks/2en53chun-o_5.css" />
  <style>
    :root {
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --brand-light: #eff6ff;
      --navy: #0f172a;
      --navy-light: #1e293b;
      --accent: #ea580c;
      --surface: #ffffff;
      --background: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8125rem;
      background-color: var(--background);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; font-size: inherit; }
    .btn-primary {
      background: var(--brand);
      color: #fff;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      border: none;
      font-weight: 700;
      font-size: 0.875rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-primary:hover { background: var(--brand-dark); transform: translateY(-1px); }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-secondary:hover { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .auth-box { max-width: 440px; width: 100%; padding: 2.25rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--navy); }
    .form-control { width: 100%; padding: 0.625rem 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.875rem; outline: none; transition: border-color 0.15s; }
    .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    @media (max-width: 480px) {
      .auth-container { padding: 1.25rem 0.75rem; }
      .auth-box { padding: 1.5rem 1.125rem; border-radius: 0.75rem; }
      .auth-box h1 { font-size: 1.25rem !important; }
    }
  </style>
</head>
<body style="background: #f1f5f9;">
  <div class="auth-container">
    <div class="card auth-box">
      <!-- Top Branding -->
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="/" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
          <img src="/logo.jpeg" alt="HetEx Logo" style="height: 48px; max-width: 180px; width: auto; object-fit: contain; display: block; margin: 0 auto 0.85rem auto;" />
        </a>
        <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--navy);">Reset Your Password</h1>
        <p id="subHeaderDesc" style="color: var(--text-muted); font-size: 0.8125rem; margin-top: 0.25rem;">
          Enter your registered email address to receive a secure 6-digit verification code.
        </p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="resetAlert" style="display: none; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.8125rem; margin-bottom: 1.25rem; font-weight: 600;"></div>

      <!-- STEP 1: Email Form (Request OTP) -->
      <form id="step1EmailForm">
        <div class="form-group">
          <label for="emailInput">Registered Account Email *</label>
          <input type="email" id="emailInput" class="form-control" placeholder="seller@business.com" required autofocus />
        </div>

        <button type="submit" id="btnSendOtp" class="btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.25rem;">
          <span>📧 Send Verification Code</span>
        </button>
      </form>

      <!-- STEP 2: Verify OTP & New Password Form -->
      <form id="step2ResetForm" style="display: none;">
        <!-- Recipient Info Strip -->
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 0.5rem; padding: 0.65rem 0.85rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
          <div style="overflow: hidden;">
            <span style="font-size: 0.7rem; color: #1e40af; font-weight: 700; text-transform: uppercase;">Code Sent To:</span>
            <div id="sentEmailBadge" style="font-weight: 800; color: #1d4ed8; font-size: 0.8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</div>
          </div>
          <button type="button" onclick="goToStep1()" style="background: none; border: none; color: #2563eb; font-weight: 700; font-size: 0.75rem; cursor: pointer; text-decoration: underline;">Change</button>
        </div>

        <!-- 6-Digit OTP Field -->
        <div class="form-group">
          <label for="otpCodeInput" style="text-align: center; display: block;">Enter 6-Digit Verification Code *</label>
          <input type="text" id="otpCodeInput" class="form-control" placeholder="______" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" style="text-align: center; font-size: 1.6rem; letter-spacing: 0.3em; font-weight: 800; padding: 0.65rem;" required autocomplete="one-time-code" />
        </div>

        <!-- New Password Field with Show/Hide -->
        <div class="form-group">
          <label for="newPasswordInput">New Password *</label>
          <div style="position: relative;">
            <input type="password" id="newPasswordInput" class="form-control" placeholder="At least 6 characters" minlength="6" required style="padding-right: 3.5rem;" />
            <button type="button" id="togglePassBtn" onclick="togglePasswordVisibility('newPasswordInput', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 700;">Show</button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPasswordInput">Confirm New Password *</label>
          <input type="password" id="confirmPasswordInput" class="form-control" placeholder="Re-enter new password" minlength="6" required />
        </div>

        <!-- Resend Code Button -->
        <div style="text-align: center; margin-bottom: 1.25rem;">
          <span style="font-size: 0.75rem; color: var(--text-muted);">Didn't receive the email? </span>
          <button type="button" id="resendOtpBtn" onclick="resendOtpCode()" style="background: none; border: none; color: var(--brand); font-weight: 700; font-size: 0.75rem; cursor: pointer; text-decoration: underline;">Resend Code</button>
          <span id="resendTimerSpan" style="font-size: 0.75rem; color: #94a3b8; display: none;"></span>
        </div>

        <button type="submit" id="btnSubmitReset" class="btn-primary" style="width: 100%; padding: 0.75rem;">
          <span>🔒 Verify OTP & Reset Password</span>
        </button>
      </form>

      <!-- Bottom Nav Link -->
      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.8125rem; text-align: center; color: var(--text-muted);">
        Remember your password? <a href="/login" style="color: var(--brand); font-weight: 700;">Back to Log In</a>
      </div>
    </div>
  </div>

  <script>
    // Clean URL normalization: ensure no .html in browser URL
    (function() {
      try {
        const p = window.location.pathname;
        if (p.endsWith('.html')) {
          let clean = p.replace(/\.html$/, '');
          if (clean.endsWith('/index')) clean = clean.slice(0, -6) || '/';
          if (clean.endsWith('/track-public')) clean = clean.slice(0, -13) + '/track';
          window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
        }
      } catch (e) {}
    })();

    let currentEmail = '';
    let countdownInterval = null;

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('resetAlert');
      box.style.display = 'block';
      if (type === 'success') {
        box.style.background = '#dcfce7';
        box.style.color = '#15803d';
        box.style.border = '1px solid #bbf7d0';
      } else if (type === 'info') {
        box.style.background = '#eff6ff';
        box.style.color = '#1d4ed8';
        box.style.border = '1px solid #bfdbfe';
      } else {
        box.style.background = '#fee2e2';
        box.style.color = '#b91c1c';
        box.style.border = '1px solid #fecaca';
      }
      box.textContent = msg;
    }

    function hideAlert() {
      document.getElementById('resetAlert').style.display = 'none';
    }

    function goToStep1() {
      hideAlert();
      document.getElementById('step1EmailForm').style.display = 'block';
      document.getElementById('step2ResetForm').style.display = 'none';
      document.getElementById('subHeaderDesc').textContent = 'Enter your registered email address to receive a secure 6-digit verification code.';
      document.getElementById('emailInput').focus();
    }

    function togglePasswordVisibility(fieldId, btn) {
      const f = document.getElementById(fieldId);
      if (f.type === 'password') {
        f.type = 'text';
        btn.textContent = 'Hide';
      } else {
        f.type = 'password';
        btn.textContent = 'Show';
      }
    }

    // Step 1: Send OTP to Email
    document.getElementById('step1EmailForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      if (!email) {
        showAlert('Please enter your account email address.');
        return;
      }

      currentEmail = email;
      const btn = document.getElementById('btnSendOtp');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Sending Verification Code...</span>';

      try {
        // Call the same OTP send API endpoint used for email verification
        const res = await fetch('/api/auth/resend-email-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, type: 'FORGOT_PASSWORD' })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to send verification code to this email.');
        }

        // Show step 2
        document.getElementById('sentEmailBadge').textContent = email;
        document.getElementById('step1EmailForm').style.display = 'none';
        document.getElementById('step2ResetForm').style.display = 'block';
        document.getElementById('subHeaderDesc').textContent = 'Enter the 6-digit code sent to your email along with your new password.';

        showAlert(data.message || ('Verification code successfully sent to ' + email + '!'), 'info');
        document.getElementById('otpCodeInput').focus();
        startResendCountdown(30);

      } catch (err) {
        showAlert(err.message || 'Error communicating with server.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });

    // Step 2: Resend OTP Handler
    async function resendOtpCode() {
      if (!currentEmail) return;
      hideAlert();
      const btn = document.getElementById('resendOtpBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/api/auth/resend-email-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, type: 'FORGOT_PASSWORD' })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to resend code');

        showAlert(data.message || ('A new verification code has been dispatched to ' + currentEmail), 'info');
        startResendCountdown(45);
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.textContent = 'Resend Code';
      }
    }

    function startResendCountdown(seconds) {
      const btn = document.getElementById('resendOtpBtn');
      const timerSpan = document.getElementById('resendTimerSpan');
      if (countdownInterval) clearInterval(countdownInterval);

      btn.style.display = 'none';
      timerSpan.style.display = 'inline';

      let remaining = seconds;
      timerSpan.textContent = `(Resend in ${remaining}s)`;

      countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          timerSpan.style.display = 'none';
          btn.style.display = 'inline';
          btn.disabled = false;
          btn.textContent = 'Resend Code';
        } else {
          timerSpan.textContent = `(Resend in ${remaining}s)`;
        }
      }, 1000);
    }

    // Step 2: Verify OTP and Reset Password
    document.getElementById('step2ResetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      const code = document.getElementById('otpCodeInput').value.trim();
      const newPass = document.getElementById('newPasswordInput').value;
      const confirmPass = document.getElementById('confirmPasswordInput').value;

      if (!code || code.length !== 6) {
        showAlert('Please enter the 6-digit verification code.');
        return;
      }
      if (newPass.length < 6) {
        showAlert('Password must be at least 6 characters.');
        return;
      }
      if (newPass !== confirmPass) {
        showAlert('New password and confirmation password do not match.');
        return;
      }

      const btn = document.getElementById('btnSubmitReset');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Resetting Password...</span>';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentEmail,
            code: code,
            password: newPass
          })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to reset password. Please check the code.');
        }

        showAlert('🎉 ' + (data.message || 'Password reset successfully! Redirecting to login...'), 'success');
        btn.style.background = '#16a34a';
        btn.innerHTML = '<span>✅ Password Updated!</span>';

        setTimeout(() => {
          window.location.href = '/login?reset=success';
        }, 1500);

      } catch (err) {
        showAlert(err.message || 'Failed to verify code.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
