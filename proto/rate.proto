syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "RateProto";

import "common.proto";

service RateService {
  rpc GetRates(GetRatesRequest) returns (GetRatesResponse);
  rpc CheckServiceability(CheckServiceabilityRequest) returns (CheckServiceabilityResponse);
}

message CheckServiceabilityRequest {
  string fromPincode = 1;
  string toPincode = 2;
}

message ServiceabilityRow {
  string courierName = 1;
  string logoColor = 2;
  bool serviceable = 3;
  bool codAvailable = 4;
  int32 estimatedDays = 5;
}

message CheckServiceabilityResponse {
  repeated ServiceabilityRow couriers = 1;
}

message GetRatesRequest {
  string from_pincode = 1;
  string to_pincode = 2;
  double weight = 3;
  double length = 4;
  double width = 5;
  double height = 6;
  string payment_mode = 7; // "COD" or "PREPAID"
  double cod_amount = 8;
  string package_type = 9;
}

message RateQuote {
  string courier_id = 1;
  string courier_name = 2;
  string courier_code = 3;
  string logo_color = 4;
  double rating = 5;
  int32 eta_min_days = 6;
  int32 eta_max_days = 7;
  double billable_weight = 8;
  double freight_charge = 9;
  double cod_charge = 10;
  double total_charge = 11;
  double seller_price = 12;
  double margin = 13;
  double rto_risk_percent = 14;
}

message GetRatesResponse {
  double billable_weight = 1;
  repeated RateQuote quotes = 2;
}
