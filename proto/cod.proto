syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "CodProto";

import "google/protobuf/empty.proto";

service CodService {
  rpc ListRemittances(google.protobuf.Empty) returns (ListRemittancesResponse);
}

message RemittanceRow {
  string id = 1;
  string order_number = 2;
  string courier_name = 3;
  double amount = 4;
  string status = 5;
  string settled_at = 6;
}

message RemittanceSummary {
  double total = 1;
  double pending = 2;
  double processing = 3;
  double settled = 4;
}

message ListRemittancesResponse {
  repeated RemittanceRow remittances = 1;
  RemittanceSummary summary = 2;
}
