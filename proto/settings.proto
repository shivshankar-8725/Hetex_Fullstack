syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "SettingsProto";

import "google/protobuf/empty.proto";

service SettingsService {
  rpc GetTrackingPageConfig(google.protobuf.Empty) returns (TrackingPageConfigMsg);
  rpc UpdateTrackingPageConfig(UpdateTrackingPageConfigRequest) returns (TrackingPageConfigMsg);
}

message TrackingPageConfigMsg {
  string brand_name = 1;
  string primary_color = 2;
  string logo_url = 3;
}

message UpdateTrackingPageConfigRequest {
  string brand_name = 1;
  string primary_color = 2;
  string logo_url = 3;
}
