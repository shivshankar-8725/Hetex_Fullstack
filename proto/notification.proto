syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "NotificationProto";

import "google/protobuf/empty.proto";

service NotificationService {
  rpc ListNotifications(google.protobuf.Empty) returns (ListNotificationsResponse);
}

message NotificationRow {
  string id = 1;
  string channel = 2;
  string recipient = 3;
  string message = 4;
  string orderId = 5;
  string createdAt = 6;
}

message ListNotificationsResponse {
  repeated NotificationRow notifications = 1;
}
