syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "CommonProto";

enum Role {
  SELLER = 0;
  ADMIN = 1;
}

enum KycStatus {
  KYC_PENDING = 0;
  KYC_VERIFIED = 1;
  KYC_REJECTED = 2;
}

enum AddressType {
  PICKUP = 0;
  BUYER = 1;
}

enum PaymentMode {
  PREPAID = 0;
  COD = 1;
}

enum ShipmentStatus {
  READY_TO_SHIP = 0;
  MANIFESTED = 1;
  PICKUP_SCHEDULED = 2;
  IN_TRANSIT = 3;
  OUT_FOR_DELIVERY = 4;
  DELIVERED = 5;
  NDR = 6;
  RTO_INITIATED = 7;
  RTO_DELIVERED = 8;
  CANCELLED = 9;
}

enum OrderStatus {
  DRAFT = 0;
  BOOKED = 1;
  ORDER_CANCELLED = 2;
}

message AddressMsg {
  string id = 1;
  string type = 2;
  string label = 3;
  string contact_name = 4;
  string phone = 5;
  string address_line1 = 6;
  string address_line2 = 7;
  string city = 8;
  string state = 9;
  string pincode = 10;
  bool is_default = 11;
}

message CourierMsg {
  string id = 1;
  string name = 2;
  string code = 3;
  string logo_color = 4;
  bool active = 5;
  double base_rate_per_kg = 6;
  double rating = 7;
  int32 eta_min_days = 8;
  int32 eta_max_days = 9;
  double rto_risk_percent = 10;
}

message TrackingEventMsg {
  string id = 1;
  string status = 2;
  string description = 3;
  string location = 4;
  string timestamp = 5;
}

message NdrRecordMsg {
  string id = 1;
  string shipment_id = 2;
  int32 attempt_number = 3;
  string reason = 4;
  string action = 5;
  string notes = 6;
  string created_at = 7;
}

message CodRemittanceMsg {
  string id = 1;
  string shipment_id = 2;
  double amount = 3;
  string status = 4;
  string settled_at = 5;
}

message ShipmentMsg {
  string id = 1;
  string order_id = 2;
  CourierMsg courier = 3;
  string awb_number = 4;
  double rate_charged = 5;
  double margin_earned = 6;
  string status = 7;
  string current_location = 8;
  repeated TrackingEventMsg tracking_events = 9;
  repeated NdrRecordMsg ndr_records = 10;
  CodRemittanceMsg cod_remittance = 11;
  bool has_cod_remittance = 12;
}

message OrderSummary {
  string id = 1;
  string order_number = 2;
  string payment_mode = 3;
  double billable_weight = 4;
  string created_at = 5;
  string status = 6;
  string buyer_contact_name = 7;
  string buyer_city = 8;
  ShipmentMsg shipment = 9;
  bool has_shipment = 10;
}
