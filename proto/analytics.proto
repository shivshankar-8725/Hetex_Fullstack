syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsProto";

import "google/protobuf/empty.proto";

service AnalyticsService {
  rpc GetAnalytics(google.protobuf.Empty) returns (AnalyticsResponse);
}

message OrdersPerDay {
  string date = 1;
  int32 count = 2;
}

message CourierSplitEntry {
  string name = 1;
  int32 count = 2;
  double avg_delivery_days = 3;
  double sla_compliance_rate = 4;
}

message PaymentSplitEntry {
  string name = 1;
  int32 value = 2;
}

message CourierSlaStatus {
  string courier_name = 1;
  int32 meeting_sla = 2;
  int32 sla_at_risk = 3;
  int32 missed_sla = 4;
  double sla_percentage = 5;
}

message MonthlyExpenseEntry {
  string month = 1;
  double freight_charges = 2;
  double cod_handling = 3;
  double fuel_surcharge = 4;
  double margin_earned = 5;
}

message AnalyticsTotals {
  int32 orders = 1;
  int32 delivered = 2;
  int32 rto = 3;
  double rto_percent = 4;
  double total_investment = 5;
  double revenue_generated = 6;
  double avg_delivery_days = 7;
  double overall_sla_rate = 8;
}

message AnalyticsResponse {
  repeated OrdersPerDay orders_per_day = 1;
  repeated CourierSplitEntry courier_split = 2;
  repeated PaymentSplitEntry payment_split = 3;
  repeated CourierSlaStatus courier_sla = 4;
  repeated MonthlyExpenseEntry monthly_expenses = 5;
  AnalyticsTotals totals = 6;
}

