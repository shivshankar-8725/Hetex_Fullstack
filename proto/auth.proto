syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "AuthProto";

import "common.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc SendPhoneOtp(SendPhoneOtpRequest) returns (SendPhoneOtpResponse);
  rpc VerifyPhoneOtp(VerifyPhoneOtpRequest) returns (AuthResponse);
  rpc VerifyEmailOtp(VerifyEmailOtpRequest) returns (AuthResponse);
  rpc ResendEmailOtp(ResendEmailOtpRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);
  rpc RequestGstOtp(RequestGstOtpRequest) returns (RequestGstOtpResponse);
  rpc RequestKycOtp(RequestKycOtpRequest) returns (RequestKycOtpResponse);
  rpc VerifyKycOtp(VerifyKycOtpRequest) returns (ProfileResponse);
  rpc SubmitEkyc(SubmitEkycRequest) returns (ProfileResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (AuthResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse);
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
}

message RegisterResponse {
  string email = 1;
  string phone = 2;
  string devOtp = 3;
}

message SendPhoneOtpRequest {
  string phone = 1;
}

message SendPhoneOtpResponse {
  string phone = 1;
  string devOtp = 2;
}

message VerifyPhoneOtpRequest {
  string phone = 1;
  string code = 2;
}

message VerifyEmailOtpRequest {
  string email = 1;
  string code = 2;
}

message ResendEmailOtpRequest {
  string email = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string user_id = 2;
  string name = 3;
  Role role = 4;
}

message GetProfileRequest {
  string user_id = 1;
}

message ProfileResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string business_name = 5;
  Role role = 6;
  KycStatus kyc_status = 7;
  string pan_number = 8;
  string gst_number = 9;
  double wallet_balance = 10;
  bool email_verified = 11;
  bool phone_verified = 12;
  string aadhaar_number = 13;
}

message RequestGstOtpRequest {
  string gstNumber = 1;
}

message RequestGstOtpResponse {
  string gstNumber = 1;
  string devOtp = 2;
}

enum KycDocumentType {
  PAN = 0;
  AADHAAR = 1;
  GST = 2;
}

message RequestKycOtpRequest {
  KycDocumentType documentType = 1;
  string documentNumber = 2;
}

message RequestKycOtpResponse {
  KycDocumentType documentType = 1;
  string documentNumber = 2;
  string referenceId = 3;
  string devOtp = 4;
}

message VerifyKycOtpRequest {
  KycDocumentType documentType = 1;
  string documentNumber = 2;
  string referenceId = 3;
  string otp = 4;
  bool consent = 5;
}

message SubmitEkycRequest {
  string panNumber = 1;
  string gstNumber = 2;
  string gstOtp = 3;
  bool consent = 4;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  string email = 1;
  string devOtp = 2;
}

message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string newPassword = 3;
}

message UpdateProfileRequest {
  string name = 1;
  string business_name = 2;
}
