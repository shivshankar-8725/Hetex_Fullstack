syntax = "proto3";

package hetex;

option java_package = "com.hetex.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "WalletProto";

import "google/protobuf/empty.proto";

service WalletService {
  rpc GetWallet(google.protobuf.Empty) returns (WalletResponse);
  // Legacy simple recharge (kept for backward compatibility — routes through verifyPayment internally)
  rpc Recharge(RechargeRequest) returns (RechargeResponse);
  // Step 1: Create Razorpay order — returns order_id + public key for Checkout SDK
  rpc CreatePaymentOrder(CreatePaymentOrderRequest) returns (CreatePaymentOrderResponse);
  // Step 2a (Checkout): Frontend completes payment → verify signature → credit wallet
  rpc VerifyPayment(VerifyPaymentRequest) returns (VerifyPaymentResponse);
  // Step 1b (QR): Create a Razorpay UPI QR code for the amount
  rpc CreateQrPayment(CreateQrPaymentRequest) returns (CreateQrPaymentResponse);
}

// -----------------------------------------------------------------------
// Wallet transaction message — exposed to frontend
// -----------------------------------------------------------------------
message WalletTransactionMsg {
  string id = 1;
  string type = 2;
  double amount = 3;
  double balance_before = 4;
  double balance_after = 5;
  string reason = 6;
  string created_at = 7;
  string payment_provider = 8;
  string payment_reference = 9;
  string payment_status = 10;
}

message WalletResponse {
  double balance = 1;
  repeated WalletTransactionMsg transactions = 2;
}

// -----------------------------------------------------------------------
// Legacy recharge (kept so existing callers don't break)
// -----------------------------------------------------------------------
message RechargeRequest {
  double amount = 1;
}

message RechargeResponse {
  double balance = 1;
}

// -----------------------------------------------------------------------
// Razorpay Checkout flow
// -----------------------------------------------------------------------
message CreatePaymentOrderRequest {
  double amount = 1;
}

message CreatePaymentOrderResponse {
  string razorpay_order_id = 1;
  double amount = 2;
  string currency = 3;
  string razorpay_key_id = 4;
}

message VerifyPaymentRequest {
  string razorpay_order_id = 1;
  string razorpay_payment_id = 2;
  string razorpay_signature = 3;
  double amount = 4;
}

message VerifyPaymentResponse {
  bool success = 1;
  double balance = 2;
  string message = 3;
}

// -----------------------------------------------------------------------
// Razorpay QR / UPI flow
// -----------------------------------------------------------------------
message CreateQrPaymentRequest {
  double amount = 1;
  string description = 2;
}

message CreateQrPaymentResponse {
  string qr_code_id = 1;
  string image_url = 2;
  string razorpay_order_id = 3;
  double amount = 4;
  string currency = 5;
  bool is_real = 6;
  string message = 7;
}
